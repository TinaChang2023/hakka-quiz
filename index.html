<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海陸客語練習小工具</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f0f4f4;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col md:flex-row">

    <!-- 手機版頂部導覽列 (Mobile Header) -->
    <div class="md:hidden bg-white border-b border-slate-200 p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="font-bold text-lg text-emerald-700 flex items-center gap-2">
            <img src="-PageUpload-1990-1-1990-01-0185211614671.gif" alt="Logo" class="w-7 h-7 object-contain"> 海陸客語練習
        </h1>
        <button onclick="toggleMobileMenu()" class="p-2 text-slate-600 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </div>

    <!-- 側邊欄 (Sidebar) - 桌面版固定，手機版可收合 -->
    <aside id="sidebar" class="hidden md:flex flex-col w-64 bg-[#f8fafa] border-r border-slate-200/80 p-6 min-h-screen fixed md:static z-40 inset-y-0 left-0 transition-all">
        <!-- Logo / 標題 -->
        <div class="flex items-center gap-3 mb-8 px-2">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 flex items-center justify-center p-1 shadow-sm">
                <img src="-PageUpload-1990-1-1990-01-0185211614671.gif" alt="Logo" class="w-full h-full object-contain">
            </div>
            <span class="font-bold text-slate-800 tracking-wide">客語學習小工具</span>
        </div>

        <!-- 導覽選單群組 -->
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-2">Menu</div>
        <nav class="space-y-1 mb-8">
            <button onclick="switchTab('quiz-zh-hakka')" id="nav-quiz-zh-hakka" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition bg-emerald-100/70 text-emerald-800 shadow-sm">
                <span>🎯</span> 測驗區 (中翻客)
            </button>
            <button onclick="switchTab('quiz-hakka-zh')" id="nav-quiz-hakka-zh" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 hover:bg-slate-100">
                <span>🎯</span> 測驗區 (客翻中)
            </button>
            <button onclick="switchTab('search')" id="nav-search" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 hover:bg-slate-100">
                <span>🔍</span> 找單字
            </button>
            <button onclick="switchTab('add')" id="nav-add" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 hover:bg-slate-100">
                <span>➕</span> 新增單字區
            </button>
        </nav>

        <!-- 底部題庫總數 -->
        <div class="mt-auto px-2 py-4 bg-emerald-50 rounded-2xl border border-emerald-100/60 text-center">
            <div class="text-xs text-emerald-600 font-medium mb-1">雲端題庫總數</div>
            <div id="sidebar-total-count" class="text-xl font-bold text-emerald-700">0</div>
        </div>
    </aside>

    <!-- 主內容區 (Main Content) -->
    <main class="flex-1 p-4 md:p-10 max-w-6xl mx-auto w-full">
        
        <!-- 頂部標題列 (Header Bar) -->
        <header class="mb-8 bg-white/60 backdrop-blur-md p-4 md:px-8 md:py-5 rounded-2xl border border-slate-200/60 shadow-sm">
            <div>
                <h1 id="page-title" class="text-2xl md:text-3xl font-bold text-slate-800">測驗區 (中翻客)</h1>
                <p id="page-subtitle" class="text-sm text-slate-500 mt-0.5">根據中文意思，挑戰拼出對應的客語與音標</p>
            </div>
        </header>

        <!-- 載入中狀態 -->
        <div id="loading" class="text-center py-20 bg-white rounded-3xl shadow-sm border border-slate-200/60">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
            <p class="mt-3 text-slate-500 font-medium">正在從雲端同步題庫...</p>
        </div>

        <!-- 1. 測驗共用區塊 (由 JS 控制顯示內容) -->
        <div id="section-quiz" class="hidden space-y-6">
            <!-- 初始設定卡片 -->
            <div id="quiz-setup" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/60 max-w-lg mx-auto text-center space-y-6">
                <div>
                    <h2 id="setup-title" class="text-xl font-bold text-slate-800 mb-1">開始新測驗 (中翻客)</h2>
                    <p class="text-sm text-slate-500">系統將從現有題庫中隨機抽題</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex items-center justify-between">
                    <span class="text-sm text-slate-600 font-medium">本次測驗題數</span>
                    <input type="number" id="question-count" value="10" min="1" class="w-20 text-center border border-slate-300 rounded-xl py-2 px-3 text-lg font-bold text-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                </div>
                <button onclick="startQuiz()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-500/25 transition">開始挑戰</button>
            </div>

            <!-- 實際測驗進行中卡片 -->
            <div id="quiz-play" class="hidden bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200/60 max-w-3xl mx-auto">
                <div class="flex justify-between items-center text-sm text-slate-400 mb-6 px-2">
                    <span id="quiz-progress" class="font-semibold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">第 1 題 / 共 10 題</span>
                    <button onclick="resetQuizSetup()" class="text-slate-500 hover:text-slate-800 underline">重新設定</button>
                </div>

                <!-- 左右題目解答對照 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch mb-8">
                    <!-- 左側：題目區 -->
                    <div id="quiz-left-box" class="bg-slate-50 p-6 rounded-2xl border border-slate-100 text-center flex flex-col justify-center min-h-[160px]">
                        <span id="quiz-left-label" class="text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">中文題目</span>
                        <h3 id="quiz-question" class="text-2xl font-bold text-slate-800">-</h3>
                        <!-- 客翻中模式下，音標會顯示在此處文字下方 -->
                        <div id="quiz-phonetic-sub" class="mt-2 text-sm text-slate-500 font-mono hidden"></div>
                    </div>

                    <!-- 右側：解答區 -->
                    <div id="quiz-right-box" class="bg-emerald-50/40 p-6 rounded-2xl border border-emerald-100 text-center flex flex-col justify-center min-h-[160px]">
                        <span id="quiz-right-label" class="text-xs uppercase tracking-wider text-emerald-600/70 mb-2 font-semibold">客語解答</span>
                        <div id="quiz-answer-content" class="text-slate-400 italic">
                            (點擊下方按鈕顯示解答)
                        </div>
                    </div>
                </div>

                <!-- 控制按鈕 -->
                <div class="flex gap-4">
                    <button id="btn-show-answer" onclick="revealAnswer()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-3.5 rounded-2xl font-bold shadow-md transition">看解答</button>
                    <button id="btn-next" onclick="nextQuestion()" class="hidden flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-500/25 transition">下一題</button>
                </div>
            </div>

            <!-- 測驗結算畫面 -->
            <div id="quiz-result" class="hidden bg-white p-8 rounded-3xl shadow-sm border border-slate-200/60 text-center max-w-md mx-auto space-y-6">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">🎉</div>
                <div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-1">測驗完成！</h2>
                    <p class="text-slate-500">太棒了！你已經順利完成本輪的練習。</p>
                </div>
                <button onclick="resetQuizSetup()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-500/25 transition">再測驗一次</button>
            </div>
        </div>

        <!-- 2. 找單字區塊 -->
        <div id="section-search" class="hidden space-y-6 max-w-3xl mx-auto">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60">
                <div class="flex gap-3">
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="輸入中文、客語或音標搜尋單字..." class="flex-1 border border-slate-200 bg-slate-50 rounded-2xl py-3.5 px-5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white text-base">
                    <button onclick="handleSearch()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 rounded-2xl font-bold transition shadow-md shadow-emerald-500/20">搜尋</button>
                </div>
            </div>

            <div id="search-results" class="space-y-4">
                <div class="text-center text-slate-400 py-12 bg-white rounded-3xl border border-slate-200/60">請在上方輸入關鍵字尋找單字</div>
            </div>
        </div>

        <!-- 3. 新增單字區塊 -->
        <div id="section-add" class="hidden max-w-lg mx-auto bg-white p-8 rounded-3xl shadow-sm border border-slate-200/60">
            <h2 class="text-xl font-bold text-slate-800 mb-6 text-center">新增客語單字</h2>
            <form id="add-form" onsubmit="submitWord(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1.5">中文意義 (Meaning)</label>
                    <input type="text" id="input-meaning" required placeholder="例如：配藥" class="w-full border border-slate-200 bg-slate-50 rounded-2xl py-3 px-4 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1.5">客語寫法 (Word)</label>
                    <input type="text" id="input-word" required placeholder="例如：合藥仔" class="w-full border border-slate-200 bg-slate-50 rounded-2xl py-3 px-4 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1.5">音標 (Phonetic)</label>
                    <input type="text" id="input-phonetic" placeholder="例如：gab rhog` er" class="w-full border border-slate-200 bg-slate-50 rounded-2xl py-3 px-4 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white font-mono text-sm">
                </div>
                <button type="submit" id="btn-submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-500/25 transition mt-2">確認新增並同步</button>
            </form>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxspz-WqolHRSUCrmSVRyVW8_TaKZRHSPxbRW6WsyxNdt50Sxd4Dr8aCQlvxIh1jZa7/exec";

        let allWords = [];
        let currentQuizList = [];
        let currentIndex = 0;
        let currentMode = 'zh-hakka'; // 'zh-hakka' 或 'hakka-zh'

        window.onload = function() {
            fetchWords();
        };

        function fetchWords() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    allWords = data;
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('section-quiz').classList.remove('hidden');
                    document.getElementById('sidebar-total-count').innerText = allWords.length;
                })
                .catch(err => {
                    alert("載入題庫失敗，請檢查 API 網址或網路連線！");
                    console.error(err);
                });
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('flex', 'absolute', 'shadow-2xl');
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('flex', 'absolute', 'shadow-2xl');
            }
        }

        function switchTab(tab) {
            const quizSec = document.getElementById('section-quiz');
            const addSec = document.getElementById('section-add');
            const searchSec = document.getElementById('section-search');
            
            const navZhHakka = document.getElementById('nav-quiz-zh-hakka');
            const navHakkaZh = document.getElementById('nav-quiz-hakka-zh');
            const navAdd = document.getElementById('nav-add');
            const navSearch = document.getElementById('nav-search');

            const pageTitle = document.getElementById('page-title');
            const pageSubtitle = document.getElementById('page-subtitle');
            const setupTitle = document.getElementById('setup-title');

            quizSec.classList.add('hidden');
            addSec.classList.add('hidden');
            searchSec.classList.add('hidden');

            const inactiveClass = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 hover:bg-slate-100";
            const activeClass = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition bg-emerald-100/70 text-emerald-800 shadow-sm";

            navZhHakka.className = inactiveClass;
            navHakkaZh.className = inactiveClass;
            navAdd.className = inactiveClass;
            navSearch.className = inactiveClass;

            // 每次切換分頁時重置回測驗設定頁面
            resetQuizSetup();

            if (tab === 'quiz-zh-hakka') {
                currentMode = 'zh-hakka';
                quizSec.classList.remove('hidden');
                navZhHakka.className = activeClass;
                pageTitle.innerText = "測驗區 (中翻客)";
                pageSubtitle.innerText = "根據中文意思，挑戰拼出對應的客語與音標";
                setupTitle.innerText = "開始新測驗 (中翻客)";
            } else if (tab === 'quiz-hakka-zh') {
                currentMode = 'hakka-zh';
                quizSec.classList.remove('hidden');
                navHakkaZh.className = activeClass;
                pageTitle.innerText = "測驗區 (客翻中)";
                pageSubtitle.innerText = "根據客語題目，挑戰說出或猜出中文意思";
                setupTitle.innerText = "開始新測驗 (客翻中)";
            } else if (tab === 'search') {
                searchSec.classList.remove('hidden');
                navSearch.className = activeClass;
                pageTitle.innerText = "找單字";
                pageSubtitle.innerText = "快速檢索中文、客語與專屬音標";
            } else if (tab === 'add') {
                addSec.classList.remove('hidden');
                navAdd.className = activeClass;
                pageTitle.innerText = "新增單字區";
                pageSubtitle.innerText = "擴充雲端題庫，建立專屬客語字彙";
            }

            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('sidebar').classList.remove('flex', 'absolute', 'shadow-2xl');
            }
        }

        function startQuiz() {
            const countInput = parseInt(document.getElementById('question-count').value);
            if (allWords.length === 0) {
                alert("目前題庫沒有單字！");
                return;
            }

            const count = Math.min(countInput, allWords.length);
            currentQuizList = [...allWords].sort(() => 0.5 - Math.random()).slice(0, count);
            currentIndex = 0;

            document.getElementById('quiz-setup').classList.add('hidden');
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-play').classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            const item = currentQuizList[currentIndex];
            document.getElementById('quiz-progress').innerText = `第 ${currentIndex + 1} 題 / 共 ${currentQuizList.length} 題`;

            const qElement = document.getElementById('quiz-question');
            const phoneticSub = document.getElementById('quiz-phonetic-sub');
            const ansContent = document.getElementById('quiz-answer-content');
            
            const leftLabel = document.getElementById('quiz-left-label');
            const rightLabel = document.getElementById('quiz-right-label');

            phoneticSub.classList.add('hidden');
            phoneticSub.innerText = "";

            if (currentMode === 'zh-hakka') {
                // 中翻客：左側中文，右側客語+音標解答
                leftLabel.innerText = "中文題目";
                rightLabel.innerText = "客語解答";
                qElement.innerText = item.Meaning || '';
                
                ansContent.className = "text-slate-400 italic";
                ansContent.innerHTML = "(點擊下方按鈕顯示解答)";
            } else {
                // 客翻中：左側客語，右側中文解答
                leftLabel.innerText = "客語題目";
                rightLabel.innerText = "中文解答";
                qElement.innerText = item.Word || '';
                
                ansContent.className = "text-slate-400 italic";
                ansContent.innerHTML = "(點擊下方按鈕顯示解答)";
            }

            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');
        }

        function revealAnswer() {
            const item = currentQuizList[currentIndex];
            const ansContent = document.getElementById('quiz-answer-content');
            const phoneticSub = document.getElementById('quiz-phonetic-sub');

            if (currentMode === 'zh-hakka') {
                ansContent.className = "text-slate-800";
                ansContent.innerHTML = `
                    <div class="text-2xl font-bold text-emerald-700 mb-1">${item.Word || ''}</div>
                    <div class="text-sm text-slate-500 font-mono">${item.Phonetic || ''}</div>
                `;
            } else {
                // 客翻中模式：右側顯示中文解答，左側客語下方顯示音標
                ansContent.className = "text-slate-800";
                ansContent.innerHTML = `
                    <div class="text-2xl font-bold text-slate-800">${item.Meaning || ''}</div>
                `;

                if (item.Phonetic) {
                    phoneticSub.innerText = item.Phonetic;
                    phoneticSub.classList.remove('hidden');
                }
            }

            document.getElementById('btn-show-answer').classList.add('hidden');
            
            if (currentIndex === currentQuizList.length - 1) {
                document.getElementById('btn-next').innerText = "查看結算";
            } else {
                document.getElementById('btn-next').innerText = "下一題";
            }
            document.getElementById('btn-next').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex >= currentQuizList.length) {
                document.getElementById('quiz-play').classList.add('hidden');
                document.getElementById('quiz-result').classList.remove('hidden');
            } else {
                loadQuestion();
            }
        }

        function resetQuizSetup() {
            document.getElementById('quiz-play').classList.add('hidden');
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-setup').classList.remove('hidden');
            document.getElementById('sidebar-total-count').innerText = allWords.length;
        }

        function handleSearch() {
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            const resultsContainer = document.getElementById('search-results');

            if (!keyword) {
                resultsContainer.innerHTML = `<div class="text-center text-slate-400 py-12 bg-white rounded-3xl border border-slate-200/60">請在上方輸入關鍵字尋找單字</div>`;
                return;
            }

            const matched = allWords.filter(item => {
                const meaning = (item.Meaning || '').toString().toLowerCase();
                const word = (item.Word || '').toString().toLowerCase();
                const phonetic = (item.Phonetic || '').toString().toLowerCase();
                return meaning.includes(keyword) || word.includes(keyword) || phonetic.includes(keyword);
            });

            if (matched.length === 0) {
                resultsContainer.innerHTML = `<div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/60 text-center text-slate-400">沒有找到符合「${keyword}」的單字</div>`;
                return;
            }

            let html = `<div class="text-sm font-semibold text-slate-500 px-2">找到 ${matched.length} 筆相關單字：</div>`;
            
            matched.forEach(item => {
                html += `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100 text-center flex flex-col justify-center min-h-[120px]">
                                <span class="text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">中文意思</span>
                                <h3 class="text-2xl font-bold text-slate-800">${item.Meaning || ''}</h3>
                            </div>
                            <div class="bg-emerald-50/40 p-5 rounded-2xl border border-emerald-100 text-center flex flex-col justify-center min-h-[120px]">
                                <span class="text-xs uppercase tracking-wider text-emerald-600/70 mb-1 font-semibold">客語解答</span>
                                <div class="text-2xl font-bold text-emerald-700 mb-1">${item.Word || ''}</div>
                                <div class="text-sm text-slate-500 font-mono">${item.Phonetic || ''}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
        }

        function submitWord(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = "正在檢查並同步...";

            const newWord = {
                meaning: document.getElementById('input-meaning').value,
                word: document.getElementById('input-word').value,
                phonetic: document.getElementById('input-phonetic').value
            };

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(newWord)
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === "duplicate") {
                    alert("⚠️ 新增失敗：這個客語字（Word）已經存在於題庫中了！");
                } else {
                    alert("新增成功！已同步至雲端試算表。");
                    document.getElementById('add-form').reset();
                    fetchWords(); 
                    switchTab('quiz-zh-hakka'); 
                }
                btn.disabled = false;
                btn.innerText = "確認新增並同步";
            })
            .catch(err => {
                alert("新增失敗，請稍後再試！");
                console.error(err);
                btn.disabled = false;
                btn.innerText = "確認新增並同步";
            });
        }
    </script>
